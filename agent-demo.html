<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>飞象AI助手 · Demo</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:#F6F7F9;}
  .scrollbar-thin::-webkit-scrollbar{width:6px;height:6px;}
  .scrollbar-thin::-webkit-scrollbar-thumb{background:#D6D8DC;border-radius:3px;}
  .typewriter-cursor::after{content:"▍";color:#3B82F6;animation:blink 1s steps(1) infinite;margin-left:2px;}
  @keyframes blink{50%{opacity:0;}}
  .fade-in{animation:fadeIn .35s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .chip{transition:all .15s ease;}
  .chip:hover:not(:disabled){background:#EEF2FF;border-color:#A5B4FC;color:#4338CA;}
  .chip:disabled{opacity:.5;cursor:not-allowed;}
  .drawer{transition:width .35s cubic-bezier(.4,0,.2,1),min-width .35s cubic-bezier(.4,0,.2,1),border-color .35s ease;}
  .drawer.closed{width:0;min-width:0;border-left-color:transparent;}
  .drawer.open{width:50%;min-width:360px;}
  .spinner{width:14px;height:14px;border:2px solid #DBEAFE;border-top-color:#3B82F6;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .dot{width:6px;height:6px;border-radius:50%;background:#9CA3AF;display:inline-block;margin:0 2px;animation:bounce 1.2s infinite;}
  .dot:nth-child(2){animation-delay:.15s;}.dot:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4;}40%{transform:translateY(-4px);opacity:1;}}
  .soft-pulse{animation:softPulse 1.6s ease-in-out infinite;}
  @keyframes softPulse{0%,100%{opacity:.45;}50%{opacity:1;}}
  .preview-flash{animation:previewFlash 1.1s ease both;}
  @keyframes previewFlash{0%{box-shadow:0 0 0 0 rgba(59,130,246,.35);border-color:#93C5FD;background:#EFF6FF;}100%{box-shadow:none;}}
  .skeleton-shimmer{position:relative;overflow:hidden;background:#EEF2F7;}
  .skeleton-shimmer::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:shimmer 1.4s infinite;}
  @keyframes shimmer{100%{transform:translateX(100%);}}
  .ability-card{transition:all .2s ease;}
  .ability-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.06);border-color:#A5B4FC;}
  .intent-badge{font-size:10px;padding:2px 8px;border-radius:999px;font-weight:500;letter-spacing:.02em;}
  .intent-single_full{background:#ECFDF5;color:#059669;}
  .intent-single_lack{background:#FFF7ED;color:#D97706;}
  .intent-multi_parallel{background:#EFF6FF;color:#2563EB;}
  .intent-multi_depend{background:#EEF2FF;color:#4338CA;}
  .intent-other{background:#F3F4F6;color:#6B7280;}
  .parallel-group{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .feedback-btn{transition:all .15s ease;}
  .feedback-btn:hover{border-color:#C7D2FE;background:#EEF2FF;color:#4338CA;}
  .feedback-btn.active-like{border-color:#93C5FD;background:#EFF6FF;color:#2563EB;}
  .feedback-btn.active-dislike{border-color:#FCA5A5;background:#FEF2F2;color:#DC2626;}
  .attachment-menu{box-shadow:0 16px 40px rgba(15,23,42,.12);}
  .attachment-card{transition:all .15s ease;}
  .attachment-card:hover{border-color:#BFDBFE;background:#F8FAFC;}
  .kb-modal{background:rgba(15,23,42,.28);backdrop-filter:blur(2px);}
  .kb-file-row{transition:all .15s ease;}
  .kb-file-row:hover{border-color:#93C5FD;background:#EFF6FF;}
  @media(max-width:640px){.parallel-group{grid-template-columns:1fr;}}
</style>
</head>
<body class="overflow-hidden">
<div class="h-screen flex flex-col">
  <!-- 顶栏 -->
  <header class="h-14 px-6 flex items-center justify-between bg-white border-b border-gray-100">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-500 flex items-center justify-center text-white text-xs font-bold">象</div>
      <div class="font-semibold text-gray-800">飞象AI助手</div>
      <span class="text-xs text-gray-400 ml-1">Beta · 教师专属</span>
    </div>
    <button id="newChatBtn" class="text-gray-400 hover:text-gray-600 text-xs">+ 新对话</button>
  </header>

  <!-- 主体 -->
  <main class="flex-1 flex overflow-hidden min-h-0">
    <!-- 左侧：对话区 + 输入框 -->
    <div id="chatColumn" class="flex-1 min-w-0 flex flex-col relative">
      <section id="chatArea" class="flex-1 overflow-y-auto scrollbar-thin relative min-h-0">

          <div class="w-full max-w-[860px]">
            <h1 class="text-center text-3xl font-semibold text-gray-800 mb-2">有什么我能帮你的吗?</h1>
            <p id="welcomeSubtitle" class="text-center text-sm text-gray-400 mb-8">选择下方预设,体验 5 种意图识别与处理流程</p>
            <div id="presetChips" class="max-w-[680px] mx-auto flex flex-col gap-2"></div>
          </div>
        </div>
        <!-- 对话流 -->
        <div id="chatInner" class="max-w-[760px] mx-auto px-6 py-8 space-y-6 pb-40 hidden"></div>
      </section>

      <!-- 底部输入区 -->
      <footer class="shrink-0 bg-gradient-to-t from-[#F6F7F9] via-[#F6F7F9] to-transparent pt-8 pb-6 pointer-events-none">
        <div class="max-w-[760px] mx-auto px-6 pointer-events-auto">
          <div class="relative bg-white rounded-2xl border border-gray-200 shadow-sm px-4 pt-3 pb-2">

            <div id="kbMentionPanel" class="hidden absolute left-4 right-4 bottom-[92px] bg-white border border-blue-100 rounded-2xl shadow-lg p-2 z-20">
              <div class="px-2 py-1.5 text-[11px] text-gray-400">选择知识库文件</div>
              <div id="kbMentionList" class="space-y-1"></div>
            </div>
            <div id="attachmentMenu" class="attachment-menu hidden absolute left-3 bottom-12 w-56 bg-white border border-gray-100 rounded-2xl p-2 z-30">
              <button id="addImageBtn" type="button" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl hover:bg-gray-50 text-left">
                <span class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center">🖼️</span>
                <span><span class="block text-sm text-gray-800">添加图片</span><span class="block text-xs text-gray-400">示例: 作文照片</span></span>
              </button>
              <button id="addFileBtn" type="button" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl hover:bg-gray-50 text-left">

                <span><span class="block text-sm text-gray-800">添加文件</span><span class="block text-xs text-gray-400">示例: 成绩表</span></span>
              </button>
              <button id="openKbBtn" type="button" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl hover:bg-gray-50 text-left">
                <span class="w-8 h-8 rounded-lg bg-emerald-50 flex items-center justify-center">📚</span>
                <span><span class="block text-sm text-gray-800">选择知识库文件</span><span class="block text-xs text-gray-400">也可输入 @ 选择</span></span>
              </button>
            </div>
            <textarea id="input" rows="1" placeholder="发消息… 输入 @ 可选择知识库文件" class="w-full resize-none outline-none text-sm text-gray-800 placeholder:text-gray-400 leading-6 max-h-32 mb-1"></textarea>
            <div class="flex items-center gap-1 pt-1.5 border-t border-gray-100">

              <div class="w-px h-4 bg-gray-200 mx-1"></div>
              <div id="scenarioBar" class="flex items-center gap-0.5 flex-1 overflow-x-auto scrollbar-thin"></div>
              <button class="w-7 h-7 rounded-lg hover:bg-gray-100 text-gray-500 flex items-center justify-center" title="语音">🎙️</button>
            </div>
          </div>
          <div class="text-[11px] text-gray-400 text-center mt-2">飞象AI助手 · 内容由 AI 生成,仅供教学参考</div>
        </div>
      </footer>
    </div>

    <!-- 右侧预览面板（挤开对话区，不遮盖） -->
    <aside id="drawer" class="drawer closed shrink-0 overflow-hidden bg-white border-l border-gray-200 flex flex-col">

<div id="kbModal" class="kb-modal hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4">
  <div class="bg-white w-full max-w-[520px] rounded-3xl shadow-2xl border border-gray-100 overflow-hidden">
    <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
      <div>
        <div class="text-base font-semibold text-gray-800">选择知识库文件</div>
        <div class="text-xs text-gray-400 mt-1">老师已上传的资料,选择后会附加到本次对话</div>

    </div>
    <div id="kbFileList" class="p-4 space-y-2 max-h-[360px] overflow-y-auto scrollbar-thin"></div>
  </div>

<script>
/* ============== 工具 ============== */
const $ = (sel,root=document)=>root.querySelector(sel);
const chat = $('#chatInner');
const sleep = ms => new Promise(r=>setTimeout(r,ms));
let session = 0;
const selectedAttachments = [];
const mockKnowledgeFiles = [
  {id:'kb1', kind:'kb', icon:'📘', title:'初二语文议论文写作素材库', meta:'知识库 · 48 篇范文 · 2026-05-20'},
  {id:'kb2', kind:'kb', icon:'📗', title:'本学期班级错题归因记录', meta:'知识库 · 126 条错因 · 2026-05-18'},
  {id:'kb3', kind:'kb', icon:'📙', title:'中考作文评分标准与样例', meta:'知识库 · 教研组上传 · 2026-05-12'},
  {id:'kb4', kind:'kb', icon:'📕', title:'初二(3)班近 30 天作业表现', meta:'知识库 · 学情数据 · 2026-05-24'},
];
const mockLocalAttachments = {
  image: {kind:'image', icon:'🖼️', title:'学生作文照片.jpg', meta:'图片 · 课堂拍摄示例'},
  file: {kind:'file', icon:'📎', title:'初二(3)班月考成绩.xlsx', meta:'文件 · 33KB · 示例附件'},
};

function resetToHome(){
  closeDrawer();
  chat.innerHTML = '';
  $('#input').value = '';
  selectedAttachments.splice(0, selectedAttachments.length);
  renderAttachmentPreview();
  hideAttachmentMenu();
  hideKbMentionPanel();
  const w = $('#welcome');
  w.classList.remove('hidden');
  w.style.opacity = '1';
  chat.classList.add('hidden');
  $('#chatArea').scrollTop = 0;
}

function startNewConversation(){
  session++;
  resetToHome();
  main(session);
}

function scrollBottom(){
  const a = $('#chatArea');
  a.scrollTo({top:a.scrollHeight, behavior:'smooth'});
}

function renderAttachmentPreview(){
  const wrap = $('#attachmentPreview');
  if(!selectedAttachments.length){
    wrap.classList.add('hidden');
    wrap.innerHTML = '';
    return;
  }
  wrap.classList.remove('hidden');
  wrap.innerHTML = selectedAttachments.map((file,i)=>`
    <div class="attachment-card max-w-full flex items-center gap-2 pl-2 pr-1.5 py-1.5 rounded-xl border border-gray-200 bg-gray-50/70">
      <div class="w-8 h-8 rounded-lg ${file.kind==='kb'?'bg-emerald-50':file.kind==='image'?'bg-blue-50':'bg-amber-50'} flex items-center justify-center text-base">${file.icon}</div>
      <div class="min-w-0">
        <div class="text-xs font-medium text-gray-800 truncate max-w-[210px]">${file.title}</div>
        <div class="text-[10px] text-gray-400 truncate max-w-[210px]">${file.meta}</div>
      </div>
      <button type="button" data-remove-attachment="${i}" class="w-5 h-5 rounded-full hover:bg-gray-200 text-gray-400 text-xs">✕</button>
    </div>
  `).join('');
  wrap.querySelectorAll('[data-remove-attachment]').forEach(btn=>{
    btn.onclick = ()=>{
      selectedAttachments.splice(+btn.dataset.removeAttachment, 1);
      renderAttachmentPreview();
    };
  });
}

function addAttachment(file){
  const exists = selectedAttachments.some(item=>item.title === file.title);
  if(!exists) selectedAttachments.push({...file});
  renderAttachmentPreview();
  hideAttachmentMenu();
  hideKbMentionPanel();
}

function hideAttachmentMenu(){
  $('#attachmentMenu').classList.add('hidden');
}

function toggleAttachmentMenu(){
  $('#attachmentMenu').classList.toggle('hidden');
  hideKbMentionPanel();
}

function renderKnowledgeRows(target, compact=false){
  target.innerHTML = mockKnowledgeFiles.map(file=>`
    <button type="button" data-kb-id="${file.id}" class="kb-file-row w-full flex items-center gap-3 p-3 rounded-2xl border border-gray-100 bg-white text-left">
      <div class="w-10 h-10 rounded-xl bg-emerald-50 flex items-center justify-center text-lg">${file.icon}</div>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-medium text-gray-800 truncate">${file.title}</div>
        <div class="text-xs text-gray-400 mt-0.5">${file.meta}</div>
      </div>
      ${compact ? '' : '<span class="text-xs text-blue-500">选择</span>'}
    </button>
  `).join('');
  target.querySelectorAll('[data-kb-id]').forEach(btn=>{
    btn.onclick = ()=>{
      const file = mockKnowledgeFiles.find(item=>item.id === btn.dataset.kbId);
      if(file) addAttachment(file);
      closeKbModal();
      const input = $('#input');
      input.value = input.value.replace(/@$/, '');
      input.focus();
    };
  });
}

function openKbModal(){
  hideAttachmentMenu();
  hideKbMentionPanel();
  renderKnowledgeRows($('#kbFileList'));
  $('#kbModal').classList.remove('hidden');
}

function closeKbModal(){
  $('#kbModal').classList.add('hidden');
}

function showKbMentionPanel(){
  renderKnowledgeRows($('#kbMentionList'), true);
  $('#kbMentionPanel').classList.remove('hidden');
}

function hideKbMentionPanel(){
  $('#kbMentionPanel').classList.add('hidden');
}

/* ============== 渲染原语 ============== */
function appendUser(text){
  const el = document.createElement('div');
  el.className = 'flex justify-end fade-in';
  el.innerHTML = `<div class="max-w-[80%] px-4 py-2.5 rounded-2xl rounded-tr-md bg-blue-500 text-white text-[15px] leading-7 whitespace-pre-wrap">${text}</div>`;
  chat.appendChild(el);
  scrollBottom();
}

function appendAIWrap(){
  const el = document.createElement('div');
  el.className = 'fade-in';
  el.innerHTML = `<div class="ai-body min-w-0 space-y-3"></div>`;
  chat.appendChild(el);
  return el.querySelector('.ai-body');
}

async function typewriter(node, text, speed=22){
  node.classList.add('typewriter-cursor');
  for(let i=0;i<text.length;i++){
    node.textContent += text[i];
    if(i%3===0) scrollBottom();
    await sleep(speed);
  }
  node.classList.remove('typewriter-cursor');
  scrollBottom();
}

function thinking(){
  const wrap = appendAIWrap();
  wrap.innerHTML = `<div class="text-gray-400 text-sm py-1"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
  scrollBottom();
  return wrap;
}

async function showModelLoading(body, opts={}){
  const minMs = opts.minMs ?? 4200;
  const row = document.createElement('div');
  row.className = 'model-loading text-gray-400 text-sm py-1 flex items-center gap-2';
  row.innerHTML = `
    <span class="loading-dots inline-flex items-center"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
    <span class="loading-text hidden"></span>
  `;
  body.appendChild(row);
  scrollBottom();

  const dotsEl = row.querySelector('.loading-dots');
  const textEl = row.querySelector('.loading-text');

  // 0-1s：仅展示 "..." 加载态
  const timerIntent = setTimeout(()=>{
    if(!row.isConnected) return;
    dotsEl?.classList.add('hidden');
    textEl?.classList.remove('hidden');
    if(textEl) textEl.textContent = '识别用户意图，分析任务中';
    scrollBottom();
  }, 1000);

  // 1-3s：识别意图；3s 后切换为执行中
  const timerRunning = setTimeout(()=>{
    if(!row.isConnected) return;
    if(textEl) textEl.textContent = '执行中...';
    scrollBottom();
  }, 3000);

  await sleep(minMs);
  clearTimeout(timerIntent);
  clearTimeout(timerRunning);
  row.remove();
}

function renderFeedbackActions(body){
  const wrap = document.createElement('div');
  wrap.className = 'feedback-actions flex items-center gap-2 pt-1 fade-in';
  wrap.innerHTML = `
    <button type="button" class="feedback-btn like-btn px-2.5 py-1.5 rounded-full border border-gray-200 bg-white text-xs text-gray-500 flex items-center gap-1" aria-label="点赞" aria-pressed="false">
      <span>👍</span><span>有帮助</span>
    </button>
    <button type="button" class="feedback-btn dislike-btn px-2.5 py-1.5 rounded-full border border-gray-200 bg-white text-xs text-gray-500 flex items-center gap-1" aria-label="点灭" aria-pressed="false">
      <span>👎</span><span>不准确</span>
    </button>
    <span class="feedback-tip text-xs text-gray-400 opacity-0 transition-opacity">已收到反馈</span>
  `;

  const likeBtn = wrap.querySelector('.like-btn');
  const dislikeBtn = wrap.querySelector('.dislike-btn');
  const tip = wrap.querySelector('.feedback-tip');

  const setFeedback = (choice)=>{
    const isLike = choice === 'like';
    likeBtn.classList.toggle('active-like', isLike);
    dislikeBtn.classList.toggle('active-dislike', !isLike);
    likeBtn.setAttribute('aria-pressed', String(isLike));
    dislikeBtn.setAttribute('aria-pressed', String(!isLike));
    tip.classList.remove('opacity-0');
  };

  likeBtn.onclick = ()=>setFeedback('like');
  dislikeBtn.onclick = ()=>setFeedback('dislike');
  body.appendChild(wrap);
  scrollBottom();
}

/* ============== 首屏:预设问题(5 种意图) ============== */
const intentMeta = {
  single_full:    {label:'单任务 · 信息充分', cls:'intent-single_full',    desc:'参数齐全,直接执行'},
  single_lack:    {label:'单任务 · 信息不足', cls:'intent-single_lack',    desc:'缺关键信息,先澄清'},
  multi_parallel: {label:'多任务 · 无依赖',   cls:'intent-multi_parallel', desc:'可并行,同时推进'},
  multi_depend:   {label:'多任务 · 有依赖',   cls:'intent-multi_depend',   desc:'前序结果供后续使用'},
  other:          {label:'其他',             cls:'intent-other',          desc:'闲聊问候,直接回复'},
};

let activeScenarioId = '';
const selectedScenarioConfig = {};
const casualPreset = {id:'other', text:'你好', intentType:'other'};

const scenarios = [
  {
    id:'courseware', icon:'📝', label:'生成课件',
    hint:'选择课件生成相关预设,配置课件页数与用途',
    configs:['多页课件','单页课件','讲评课件'],
    presets:[
      {id:'multi_depend', text:'根据本周作业生成班级讲评课件', intentType:'multi_depend', dynamic:true},
      {id:'single_lack', text:'把《背影》整理成一份课堂导入课件', intentType:'single_lack'},
      {id:'multi_depend', text:'先分析学生薄弱点,再生成一份复习课件', intentType:'multi_depend', dynamic:true},
    ],
  },
  {
    id:'animation', icon:'🎬', label:'生成教学动画',
    hint:'选择动画生成相关预设,配置动画类型与讲解节奏',
    configs:['知识点动画','实验演示','解题过程'],
    presets:[
      {id:'single_lack', text:'生成一个讲解二次函数图像变化的教学动画', intentType:'single_lack'},
      {id:'multi_depend', text:'先拆解浮力实验步骤,再生成课堂演示动画', intentType:'multi_depend', dynamic:true},
      {id:'single_lack', text:'把古诗意象做成 30 秒课堂导入动画', intentType:'single_lack'},
    ],
  },
  {
    id:'analysis', icon:'📊', label:'学情分析',
    hint:'选择学情分析相关预设,配置作文或作业分析范围',
    configs:['作文学情','作业学情','考试学情'],
    presets:[
      {id:'single_lack', text:'帮我分析初二(3)班近 7 天作文学情', intentType:'single_lack'},
      {id:'single_lack', text:'看一下本周数学作业的班级共性问题', intentType:'single_lack'},
      {id:'multi_depend', text:'先分析本次测验薄弱项,再生成讲评建议', intentType:'multi_depend', dynamic:true},
    ],
  },
  {
    id:'grading', icon:'✍️', label:'题目批改',
    hint:'选择批改相关预设,配置批改对象与反馈粒度',
    configs:['作文批改','作业批改','逐题批改'],
    presets:[

function renderHome(){
  const activeScenario = scenarios.find(s=>s.id === activeScenarioId);
  const presetScenario = activeScenario || scenarios[0];
  const presetQuestions = [...presetScenario.presets, casualPreset];
  if(activeScenario && !selectedScenarioConfig[activeScenario.id]){
    selectedScenarioConfig[activeScenario.id] = activeScenario.configs[0];
  }

  $('#welcomeSubtitle').textContent = activeScenario ? activeScenario.hint : '选择下方场景,切换对应预设和基础配置';

  const wrap = $('#presetChips');
  wrap.innerHTML = presetQuestions.map((q,i)=>{
    const meta = intentMeta[q.intentType];
    return `
    <button data-i="${i}" class="chip group w-full flex items-center gap-3 px-4 py-2.5 bg-white/90 hover:bg-blue-50/70 border border-gray-200 hover:border-blue-200 rounded-xl text-left transition">
      <span class="w-1.5 h-1.5 rounded-full bg-blue-400 opacity-70 shrink-0"></span>
      <span class="min-w-0 flex-1 text-sm text-gray-800 leading-6">${q.dynamic?'<span class="text-amber-500 mr-0.5">✨</span>':''}${q.text}</span>
      <span class="intent-badge ${meta.cls} shrink-0 hidden sm:inline-flex">${meta.label}</span>
      <span class="text-gray-300 group-hover:text-blue-400 transition shrink-0">›</span>
    </button>`;
  }).join('');

  renderScenarioBar(activeScenario);

  return new Promise(resolve=>{
    wrap.querySelectorAll('button').forEach(btn=>{
      btn.onclick = ()=>{
        const i = +btn.dataset.i;
        resolve(presetQuestions[i]);
      };
    });
    bindScenarioBar(resolve);
  });
}

function renderScenarioBar(activeScenario){
  const bar = $('#scenarioBar');
  if(!activeScenario){
    bar.innerHTML = scenarios.map(s=>`
      <button data-scenario="${s.id}" class="px-2.5 py-1 rounded-lg hover:bg-gray-100 text-gray-700 text-xs flex items-center gap-1 shrink-0" title="${s.label}">
        <span class="text-sm">${s.icon}</span><span>${s.label}</span>
      </button>
    `).join('');
    return;
  }

  const selected = selectedScenarioConfig[activeScenario.id] || activeScenario.configs[0];
  bar.innerHTML = `
    <button data-clear-scenario="true" class="px-2.5 py-1 rounded-lg bg-blue-50 text-blue-600 text-xs flex items-center gap-1 shrink-0" title="取消${activeScenario.label}">
      <span class="text-sm">${activeScenario.icon}</span><span>${activeScenario.label}</span><span class="text-blue-400">×</span>
    </button>
    ${activeScenario.configs.map(config=>`
      <button type="button" data-config="${config}" class="px-2.5 py-1 rounded-lg text-xs flex items-center gap-1 shrink-0 ${config===selected?'bg-gray-100 text-gray-900':'hover:bg-gray-50 text-gray-700'}">
        <span>${config}</span><span class="text-gray-400">⌄</span>
      </button>
    `).join('')}
  `;
}

function bindScenarioBar(resolve){
  const bar = $('#scenarioBar');
  bar.querySelectorAll('button[data-scenario]').forEach(btn=>{
    btn.onclick = ()=>{
      activeScenarioId = btn.dataset.scenario;
      renderHome().then(resolve);
    };
  });
  const clearBtn = bar.querySelector('button[data-clear-scenario]');
  if(clearBtn){
    clearBtn.onclick = ()=>{
      activeScenarioId = '';
      renderHome().then(resolve);
    };
  }
  const scenario = scenarios.find(s=>s.id === activeScenarioId);
  bar.querySelectorAll('button[data-config]').forEach(btn=>{
    btn.onclick = ()=>{
      if(!scenario) return;
      selectedScenarioConfig[scenario.id] = btn.dataset.config;
      renderScenarioBar(scenario);
      bindScenarioBar(resolve);
    };
  });
}

    wrap.querySelectorAll('button[data-c]').forEach(btn=>{
      btn.onclick = ()=>{
        wrap.querySelectorAll('button').forEach(b=>b.disabled=true);
        customPanel.remove();

      customPanel.remove();
      resolve(v);
    };
  });
}

/* ============== 步骤 6:任务执行(核心)============== */
async function step6_execute(tasks){
  const body = appendAIWrap();
  if(tasks.length <= 1){
    for(let i=0;i<tasks.length;i++){
      await runSubTask(body, tasks[i], {taskIndex:i, totalTasks:tasks.length});
    }
    return body;
  }

  const cards = tasks.map((task,i)=>createSubTaskCard(task, {pending:i>0}));
  cards.forEach(({card})=>body.appendChild(card));
  scrollBottom();

  for(let i=0;i<tasks.length;i++){
    await runSubTask(body, tasks[i], {card:cards[i].card, taskIndex:i, totalTasks:tasks.length});
  }
  return body;
}

async function step6_executeParallel(tasks){
  const body = appendAIWrap();
  const hint = document.createElement('div');
  hint.className = 'text-xs text-blue-500 mb-2 flex items-center gap-1.5 fade-in';
  hint.innerHTML = '<span>⚡</span><span>两个任务互不依赖,正在并行执行…</span>';
  body.appendChild(hint);

  const group = document.createElement('div');
  group.className = 'parallel-group';
  body.appendChild(group);

  const cols = tasks.map(t=>{
    const col = document.createElement('div');
    col.className = 'space-y-0';
    group.appendChild(col);
    return col;
  });

  await Promise.all(tasks.map((t,i)=>runSubTask(cols[i], t, {compact:true, taskIndex:i, totalTasks:tasks.length})));
  scrollBottom();
  await sleep(450);
  return body;
}

function createSubTaskCard(task, opts={}){
  const pending = !!opts.pending;
  const card = document.createElement('div');
  card.className = `border rounded-xl overflow-hidden fade-in ${pending?'border-gray-200 bg-gray-50/80 opacity-75':'border-gray-200 bg-white'}`;
  card.innerHTML = `
    <div class="header flex items-center gap-2.5 px-4 py-3 ${task.logs?.length||task.progress?'border-b border-gray-100':''}">
      <div class="status w-4 h-4 flex items-center justify-center">${pending?'<span class="text-gray-400 text-sm">⌛</span>':'<div class="spinner"></div>'}</div>
      <div class="task-title text-sm font-medium ${pending?'text-gray-500':'text-gray-800'} flex-1">${task.icon} ${task.title}</div>
      <div class="state text-xs text-gray-400">${pending?'待开始':opts.compact?'并行':'运行中'}</div>
      <div class="caret hidden text-gray-400 text-xs select-none">▾</div>
    </div>
    <div class="logs px-4 py-2.5 space-y-1 text-[13px] text-gray-500 leading-6 bg-gray-50/50"></div>
  `;
  return {card};
}

async function runHomeworkScan(logsEl, total){
  const row = document.createElement('div');
  row.className = 'log-line fade-in text-[13px] text-gray-500 leading-6 py-0.5 flex items-center gap-1';
  row.innerHTML = `<span>· 正在扫描作业</span> <span class="scan-num font-medium text-gray-700">0</span> <span class="text-gray-400">/ ${total} 份</span>`;
  logsEl.appendChild(row);
  const numEl = row.querySelector('.scan-num');
  const ticks = Math.min(total, 35);
  for(let i=1;i<=ticks;i++){
    numEl.textContent = Math.round(total * i / ticks);
    scrollBottom();
    await sleep(90 + Math.random()*40);
  }
  numEl.textContent = total;
  scrollBottom();
  await sleep(350);
}

function appendLogLine(logsEl, text){
  const row = document.createElement('div');
  row.className = 'log-line fade-in text-[13px] text-gray-500 leading-6 py-0.5';
  row.textContent = '· ' + text;
  logsEl.appendChild(row);
  scrollBottom();
}

function buildToolSteps(task){
  return (task.logs || []).map((name, index)=>({
    name,
    summary: task.toolSummaries?.[index] ?? '',
  }));
}

async function runSubTask(parent, task, opts={}){
  const card = opts.card || createSubTaskCard(task, opts).card;
  if(!opts.card) parent.appendChild(card);
  card.className = 'border border-gray-200 rounded-xl bg-white overflow-hidden fade-in';
  card.querySelector('.status').innerHTML = '<div class="spinner"></div>';
  card.querySelector('.task-title').className = 'task-title text-sm font-medium text-gray-800 flex-1';
  card.querySelector('.state').textContent = opts.compact?'并行':'运行中';
  scrollBottom();

  const logs = card.querySelector('.logs');
  const steps = buildToolSteps(task);

  for(const [index, step] of steps.entries()){
    // 1. 工具名称
    appendLogLine(logs, step.name);
    await sleep(700 + Math.random()*260);

    // 2. 学情分析：首个工具后展示作业扫描
    if(index === 0 && task.scanHomework){
      await runHomeworkScan(logs, task.scanHomework.total);
    }

    // 3. Agent 总结（与工具名称同一样式）
    if(step.summary){
      appendLogLine(logs, step.summary);
      await sleep(820 + Math.random()*260);
    }
  }

  // 完成态
  await sleep(380);
  card.querySelector('.status').innerHTML = `<span class="text-green-500 text-base leading-none">✓</span>`;
  const stateEl = card.querySelector('.state');
  stateEl.textContent = '已完成 · 点击查看过程';
  stateEl.className = 'state text-xs text-green-600';
  const caret = card.querySelector('.caret');
  caret.classList.remove('hidden');

  // 折叠 log
  const PAD = 10; // logs 区上下 padding
  logs.style.overflow = 'hidden';
  logs.style.transition = 'max-height .3s ease, padding .3s ease, opacity .3s ease';
  logs.style.maxHeight = logs.scrollHeight + 'px';
  await sleep(20);
  logs.style.maxHeight = '0px';
  logs.style.paddingTop = '0px';
  logs.style.paddingBottom = '0px';
  logs.style.opacity = '0';

  // 主 agent 总结(纯文本,流式打出来)
  if(task.summary){
    const sumEl = document.createElement('div');
    sumEl.className = 'summary px-4 py-3 bg-white border-t border-gray-100 text-[14px] text-gray-700 leading-7';
    card.appendChild(sumEl);
    await typewriter(sumEl, task.summary, 20);
  }
  fillDrawerChunk(opts.taskIndex ?? 0, opts.totalTasks ?? 1, task);

  // header 可点击展开/收起 log —— 修复展开高度算上 padding
  const header = card.querySelector('.header');
  header.classList.add('cursor-pointer','hover:bg-gray-50');
  let expanded = false;
  header.onclick = ()=>{
    expanded = !expanded;
    if(expanded){
      // 先恢复 padding,scrollHeight 才会包含 padding 在内
      logs.style.paddingTop = PAD + 'px';
      logs.style.paddingBottom = PAD + 'px';
      logs.style.opacity = '1';
      // 再下一帧设 maxHeight,确保过渡顺滑
      requestAnimationFrame(()=>{
        logs.style.maxHeight = logs.scrollHeight + 'px';
      });
      // 过渡结束后取消 maxHeight 限制,避免内容溢出被截
      const onEnd = (e)=>{
        if(e.propertyName !== 'max-height') return;
        logs.removeEventListener('transitionend', onEnd);
        if(expanded) logs.style.maxHeight = 'none';
      };
      logs.addEventListener('transitionend', onEnd);
      caret.textContent = '▴';
    }else{
      // 折叠前先固定当前高度,再触发过渡到 0
      logs.style.maxHeight = logs.scrollHeight + 'px';
      requestAnimationFrame(()=>{
        logs.style.maxHeight = '0px';
        logs.style.paddingTop = '0px';
        logs.style.paddingBottom = '0px';
        logs.style.opacity = '0';
      });
      caret.textContent = '▾';
    }
  };

  scrollBottom();
  await sleep(450);
}

function collapseProcessIntoFinalMessage(finalBody){
  if(!finalBody || finalBody.dataset.globalCollapsed === 'true') return;

  const detail = document.createElement('div');
  detail.className = 'process-detail hidden space-y-3';

  const finalMessage = finalBody.closest('.fade-in');
  let node = finalMessage?.previousElementSibling;
  const processMessages = [];
  while(node && !node.classList.contains('justify-end')){
    if(node.querySelector?.('.ai-body')) processMessages.unshift(node);
    node = node.previousElementSibling;
  }
  processMessages.forEach((message)=>{
    const body = message.querySelector('.ai-body');
    if(body) Array.from(body.children).forEach(child=>detail.appendChild(child));
    message.remove();
  });

  const finalProcessNodes = Array.from(finalBody.querySelectorAll('.model-loading,.reasoning-card'));
  finalProcessNodes.forEach(node=>detail.appendChild(node));

  if(!detail.children.length) return;

  const toggle = document.createElement('button');
  toggle.type = 'button';
  toggle.className = 'process-toggle w-full flex items-center justify-between px-4 py-2.5 rounded-xl border border-gray-200 bg-white text-left text-xs text-gray-500 hover:border-blue-200 hover:bg-blue-50/60 transition';
  toggle.innerHTML = `
    <span class="flex items-center gap-2"><span class="text-green-500">✓</span><span>执行过程已完成,已折叠</span></span>
    <span class="toggle-label text-blue-500">查看执行过程</span>
  `;

  let expanded = false;
  toggle.onclick = ()=>{
    expanded = !expanded;
    detail.classList.toggle('hidden', !expanded);
    toggle.querySelector('.toggle-label').textContent = expanded ? '收起执行过程' : '查看执行过程';
    scrollBottom();
  };

  finalBody.dataset.globalCollapsed = 'true';
  finalBody.prepend(detail);
  finalBody.prepend(toggle);
  scrollBottom();
}

/* ============== 抽屉 ============== */
let activePreview = {kind:'', completed:new Set()};

function openDrawer(file, opts={}){
  const drawer = $('#drawer');
  drawer.classList.remove('closed');
  drawer.classList.add('open');
  if(file){
    activePreview = {kind:file.preview, completed:new Set()};
    $('#drawerTitle').textContent = `${file.icon} ${file.title}`;
    $('#drawerBody').innerHTML = opts.skeleton ? mockPreviewSkeleton(file.preview) : mockPreview(file.preview);
  }
}
function closeDrawer(){
  const drawer = $('#drawer');
  drawer.classList.add('closed');
  drawer.classList.remove('open');
}

function fillDrawerChunk(taskIndex, totalTasks, task){
  if(!activePreview.kind || $('#drawer').classList.contains('closed')) return;
  activePreview.completed.add(taskIndex);
  const kind = activePreview.kind;
  if(kind === 'parallel'){
    $('#drawerBody').innerHTML = mockParallelProgress(activePreview.completed);
  }else if(kind === 'lesson' && totalTasks > 1 && taskIndex === 0){
    $('#drawerBody').innerHTML = mockLessonProgress();
  }else{
    $('#drawerBody').innerHTML = mockPreview(kind);
  }
  flashDrawerPreview(taskIndex);
}

function flashDrawerPreview(taskIndex=0){
  const cards = $('#drawerBody').querySelectorAll('[data-preview-part]');
  const target = cards[taskIndex] || cards[cards.length - 1] || $('#drawerBody').firstElementChild;
  if(!target) return;
  target.classList.remove('preview-flash');
  void target.offsetWidth;
  target.classList.add('preview-flash');
}

/* ============== 其他:纯对话回复(无工具/子 agent) ============== */
async function runSimpleChat(scriptObj, sid){
  const body = appendAIWrap();
  await showModelLoading(body, {minMs: 4200});
  const p = document.createElement('div');
  p.className = 'text-[15px] text-gray-800 leading-7';
  body.appendChild(p);
  await typewriter(p, scriptObj.reply);
  renderFeedbackActions(body);
  if(sid !== session) return;
  await sleep(500);
  if(sid !== session) return;
  step8_followups(scriptObj.followups);
  scrollBottom();
}

/* ============== 通用收尾:规划 → 执行 → 回复 ============== */
async function runTail(scriptObj, sid, opts={}){
  await step5_plan(scriptObj.plan, {withIntentLoading: !!opts.withIntentLoading});
  if(sid !== session) return;
  if(scriptObj.file){
    openDrawer(scriptObj.file, {skeleton:true});
  }
  let processBody;
  if(scriptObj.parallel){
    processBody = await step6_executeParallel(scriptObj.tasks);
  }else{
    processBody = await step6_execute(scriptObj.tasks);
  }
  if(sid !== session) return;
  await sleep(400);
  if(sid !== session) return;
  const finalBody = await step7_reply(scriptObj);
  collapseProcessIntoFinalMessage(finalBody);
  if(sid !== session) return;
  await sleep(500);
  if(sid !== session) return;
  step8_followups(scriptObj.followups);
  scrollBottom();
}

/* ============== 主流程:按意图类型路由 ============== */
async function main(sid){
  const preset = await renderHome();
  if(sid !== session) return;
  await enterChat();
  if(sid !== session) return;

  const intentType = preset.intentType;
  const s = scripts[preset.id];

  step3_userMsg(preset.text);
  await sleep(600);
  if(sid !== session) return;

  switch(intentType){
    case 'single_full': {
      await runTail(s, sid, {withIntentLoading: true});
      break;
    }
    case 'single_lack': {
      const cls = await step4_clarify(s.clarify);
      if(sid !== session) return;
      await sleep(300);
      step3_userMsg(cls);
      await sleep(500);
      if(sid !== session) return;
      await runTail(s, sid);
      break;
    }
    case 'multi_parallel': {
      const cls = await step4_clarify(s.clarify);
      if(sid !== session) return;
      await sleep(300);
      step3_userMsg(cls);
      await sleep(500);
      if(sid !== session) return;
      await runTail(s, sid);
      break;
    }
    case 'multi_depend': {
      const cls = await step4_clarify(s.clarify);
      if(sid !== session) return;
      await sleep(300);
      step3_userMsg(cls);
      await sleep(500);
      if(sid !== session) return;
      await runTail(s, sid);
      break;
    }
    case 'other': {
      await runSimpleChat(s, sid);
      break;
    }
  }
}
