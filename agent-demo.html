<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>学情助手 · Demo</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:#F6F7F9;}
  .scrollbar-thin::-webkit-scrollbar{width:6px;height:6px;}
  .scrollbar-thin::-webkit-scrollbar-thumb{background:#D6D8DC;border-radius:3px;}
  .typewriter-cursor::after{content:"▍";color:#3B82F6;animation:blink 1s steps(1) infinite;margin-left:2px;}
  @keyframes blink{50%{opacity:0;}}
  .fade-in{animation:fadeIn .35s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .chip{transition:all .15s ease;}
  .chip:hover:not(:disabled){background:#EEF2FF;border-color:#A5B4FC;color:#4338CA;}
  .chip:disabled{opacity:.5;cursor:not-allowed;}
  .drawer{transition:transform .35s cubic-bezier(.4,0,.2,1);}
  .drawer.closed{transform:translateX(100%);}
  .spinner{width:14px;height:14px;border:2px solid #DBEAFE;border-top-color:#3B82F6;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .dot{width:6px;height:6px;border-radius:50%;background:#9CA3AF;display:inline-block;margin:0 2px;animation:bounce 1.2s infinite;}
  .dot:nth-child(2){animation-delay:.15s;}.dot:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4;}40%{transform:translateY(-4px);opacity:1;}}
  .ability-card{transition:all .2s ease;}
  .ability-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.06);border-color:#A5B4FC;}
</style>
</head>
<body class="overflow-hidden">
<div class="h-screen flex flex-col">

  </header>

    <!-- 对话区 -->

        </div>
      </div>

      <div id="chatInner" class="max-w-[760px] mx-auto px-6 py-8 space-y-6 pb-40 hidden"></div>
    </section>

    <!-- 右侧抽屉 -->
    <aside id="drawer" class="drawer closed fixed right-0 top-14 bottom-0 w-[50%] bg-white border-l border-gray-200 shadow-2xl z-30 flex flex-col">
      <div class="h-12 px-4 flex items-center justify-between border-b border-gray-100">
        <div id="drawerTitle" class="text-sm font-medium text-gray-700 truncate">📄 文件预览</div>
        <button onclick="closeDrawer()" class="text-gray-400 hover:text-gray-700 text-lg leading-none">✕</button>
      </div>
      <div class="flex-1 overflow-y-auto bg-gray-50 p-6 scrollbar-thin" id="drawerBody"></div>
    </aside>
  </main>

  <!-- 底部输入区 -->
  <footer class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-[#F6F7F9] via-[#F6F7F9] to-transparent pt-8 pb-6 z-20 pointer-events-none">

      <!-- 追问问题 chip -->
      <div id="followupArea" class="hidden mb-2 flex flex-wrap gap-2"></div>
      <div class="bg-white rounded-2xl border border-gray-200 shadow-sm px-4 pt-3 pb-2">
        <textarea id="input" rows="1" placeholder="发消息…" class="w-full resize-none outline-none text-sm text-gray-800 placeholder:text-gray-400 leading-6 max-h-32 mb-1"></textarea>
        <div class="flex items-center gap-1 pt-1.5 border-t border-gray-100">
          <button class="w-7 h-7 rounded-lg hover:bg-gray-100 text-gray-500 flex items-center justify-center text-base" title="附件">+</button>
          <div class="w-px h-4 bg-gray-200 mx-1"></div>
          <div id="scenarioBar" class="flex items-center gap-0.5 flex-1 overflow-x-auto scrollbar-thin"></div>
          <button class="w-7 h-7 rounded-lg hover:bg-gray-100 text-gray-500 flex items-center justify-center" title="语音">🎙️</button>
        </div>
      </div>
      <div class="text-[11px] text-gray-400 text-center mt-2">学情助手 · 内容由 AI 生成,仅供教学参考</div>
    </div>
  </footer>
</div>

<script>
/* ============== 工具 ============== */
const $ = (sel,root=document)=>root.querySelector(sel);
const chat = $('#chatInner');
const sleep = ms => new Promise(r=>setTimeout(r,ms));

function scrollBottom(){
  const a = $('#chatArea');
  a.scrollTo({top:a.scrollHeight, behavior:'smooth'});
}

function aiAvatar(){
  return `<div class="w-8 h-8 shrink-0 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-500 flex items-center justify-center text-white text-xs font-bold">学</div>`;
}

/* ============== 渲染原语 ============== */
function appendUser(text){
  const el = document.createElement('div');
  el.className = 'flex justify-end fade-in';
  el.innerHTML = `<div class="max-w-[80%] px-4 py-2.5 rounded-2xl rounded-tr-md bg-blue-500 text-white text-[15px] leading-7 whitespace-pre-wrap">${text}</div>`;
  chat.appendChild(el);
  scrollBottom();
}

function appendAIWrap(){
  const el = document.createElement('div');
  el.className = 'flex gap-3 fade-in';
  el.innerHTML = `${aiAvatar()}<div class="ai-body flex-1 min-w-0 space-y-3"></div>`;
  chat.appendChild(el);
  return el.querySelector('.ai-body');
}

async function typewriter(node, text, speed=22){
  node.classList.add('typewriter-cursor');
  for(let i=0;i<text.length;i++){
    node.textContent += text[i];
    if(i%3===0) scrollBottom();
    await sleep(speed);
  }
  node.classList.remove('typewriter-cursor');
  scrollBottom();
}

function thinking(){
  const wrap = appendAIWrap();
  wrap.innerHTML = `<div class="text-gray-400 text-sm py-1"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
  scrollBottom();
  return wrap;
}

function renderHome(){
  // 预设问题
  const wrap = $('#presetChips');
  wrap.innerHTML = presetQuestions.map((q,i)=>`
    <button data-i="${i}" class="chip px-4 py-2 bg-gray-100 hover:bg-gray-200 border border-transparent rounded-full text-sm text-gray-700 transition">
      ${q.dynamic?'<span class="text-amber-500 mr-1">✨</span>':''}${q.text}
    </button>
  `).join('');

  // 场景栏
  const bar = $('#scenarioBar');
  bar.innerHTML = scenarios.map(s=>`
    <button class="px-2.5 py-1 rounded-lg hover:bg-gray-100 text-gray-600 text-xs flex items-center gap-1 shrink-0" title="${s.label}">
      <span class="text-sm">${s.icon}</span><span>${s.label}</span>
    </button>
  `).join('');

  return new Promise(resolve=>{
    wrap.querySelectorAll('button').forEach(btn=>{
      btn.onclick = ()=>{
        const i = +btn.dataset.i;
        resolve(presetQuestions[i]);
      };
    });
  });
}

async function enterChat(){
  const w = $('#welcome');
  w.style.opacity = '0';
  await sleep(280);
  w.classList.add('hidden');
  $('#chatInner').classList.remove('hidden');
}

/* ============== 步骤 3:用户消息 ============== */
function step3_userMsg(text){
  appendUser(text);
}

/* ============== 步骤 4:意图澄清(选择 + 自定义输入) ============== */
async function step4_clarify(clarify){
  const body = appendAIWrap();
  const p = document.createElement('div');
  p.className = 'text-[15px] text-gray-800 leading-7';
  body.appendChild(p);
  await typewriter(p, clarify.question);

  const wrap = document.createElement('div');
  wrap.className = 'flex flex-wrap gap-2 items-center';
  wrap.innerHTML = clarify.options.map(c=>`
    <button data-c="${c}" class="chip px-3 py-1.5 bg-white border border-gray-200 rounded-full text-sm text-gray-700">${c}</button>
  `).join('') + `
    <button id="customBtn" class="chip px-3 py-1.5 bg-white border border-dashed border-gray-300 rounded-full text-sm text-gray-500">+ 自定义</button>
  `;
  body.appendChild(wrap);

  const customPanel = document.createElement('div');
  customPanel.className = 'hidden mt-2 flex gap-2';
  customPanel.innerHTML = `
    <input id="customInput" placeholder="${clarify.customPlaceholder}" class="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm outline-none focus:border-indigo-300" />
    <button id="customSubmit" class="px-3 py-2 bg-indigo-500 text-white text-sm rounded-lg">确定</button>
  `;
  body.appendChild(customPanel);
  scrollBottom();

  return new Promise(resolve=>{
    wrap.querySelectorAll('button[data-c]').forEach(btn=>{
      btn.onclick = ()=>{
        wrap.querySelectorAll('button').forEach(b=>b.disabled=true);
        customPanel.remove();
        resolve(btn.dataset.c);
      };
    });
    wrap.querySelector('#customBtn').onclick = ()=>{
      customPanel.classList.remove('hidden');
      customPanel.classList.add('flex');
      customPanel.querySelector('input').focus();
    };
    customPanel.querySelector('#customSubmit').onclick = ()=>{
      const v = customPanel.querySelector('input').value.trim();
      if(!v) return;
      wrap.querySelectorAll('button').forEach(b=>b.disabled=true);
      customPanel.remove();
      resolve(v);
    };
  });
}

/* ============== 步骤 5:任务规划(纯文字)============== */
async function step5_plan(planText){
  const body = appendAIWrap();
  const p = document.createElement('div');
  p.className = 'text-[15px] text-gray-800 leading-7 whitespace-pre-line';
  body.appendChild(p);
  await typewriter(p, planText, 18);
  await sleep(500);
}

/* ============== 步骤 6:任务执行(核心)============== */
async function step6_execute(tasks){
  const body = appendAIWrap();
  for(const t of tasks){
    await runSubTask(body, t);
  }
}

function renderSummary(text){
  if(!text) return '';
  return `
    <div class="summary px-4 py-3 bg-white border-t border-gray-100 text-[14px] text-gray-700 leading-7"></div>
  `;
}

async function runSubTask(parent, task){
  const card = document.createElement('div');
  card.className = 'border border-gray-200 rounded-xl bg-white overflow-hidden fade-in';
  card.innerHTML = `
    <div class="header flex items-center gap-2.5 px-4 py-3 ${task.logs?.length||task.progress?'border-b border-gray-100':''}">
      <div class="status w-4 h-4 flex items-center justify-center"><div class="spinner"></div></div>
      <div class="text-sm font-medium text-gray-800 flex-1">${task.icon} ${task.title}</div>
      <div class="state text-xs text-gray-400">运行中</div>
      <div class="caret hidden text-gray-400 text-xs select-none">▾</div>
    </div>
    <div class="logs px-4 py-2.5 space-y-1 text-[13px] text-gray-500 leading-6 bg-gray-50/50"></div>
  `;
  parent.appendChild(card);
  scrollBottom();

  const logs = card.querySelector('.logs');

  // 数字进度(可选)— 慢一点
  if(task.progress){
    const row = document.createElement('div');
    row.className = 'flex items-center gap-2';
    row.innerHTML = `
      <span class="text-gray-500">${task.progress.label}</span>
      <span class="num text-gray-800 font-medium">0</span>
      <span class="text-gray-400">/ ${task.progress.to} ${task.progress.unit||''}</span>
    `;
    logs.appendChild(row);
    const numEl = row.querySelector('.num');
    const total = task.progress.to;
    const ticks = Math.min(total, 30);
    for(let i=1;i<=ticks;i++){
      numEl.textContent = Math.round(total * i / ticks);
      await sleep(110);
    }
    numEl.textContent = total;
    scrollBottom();
    await sleep(400);
  }

  // 关键 log(精简,2-3 条)— 慢一点,让人能读清
  for(const line of (task.logs||[])){
    const row = document.createElement('div');
    row.className = 'fade-in';
    row.textContent = '· ' + line;
    logs.appendChild(row);
    scrollBottom();
    await sleep(620 + Math.random()*200);
  }

  // 完成态
  await sleep(380);
  card.querySelector('.status').innerHTML = `<span class="text-green-500 text-base leading-none">✓</span>`;
  const stateEl = card.querySelector('.state');
  stateEl.textContent = '已完成 · 点击查看过程';
  stateEl.className = 'state text-xs text-green-600';
  const caret = card.querySelector('.caret');
  caret.classList.remove('hidden');

  // 折叠 log
  const PAD = 10; // logs 区上下 padding
  logs.style.overflow = 'hidden';
  logs.style.transition = 'max-height .3s ease, padding .3s ease, opacity .3s ease';
  logs.style.maxHeight = logs.scrollHeight + 'px';
  await sleep(20);
  logs.style.maxHeight = '0px';
  logs.style.paddingTop = '0px';
  logs.style.paddingBottom = '0px';
  logs.style.opacity = '0';

  // 主 agent 总结(纯文本,流式打出来)
  if(task.summary){
    const sumEl = document.createElement('div');
    sumEl.className = 'summary px-4 py-3 bg-white border-t border-gray-100 text-[14px] text-gray-700 leading-7';
    card.appendChild(sumEl);
    await typewriter(sumEl, task.summary, 20);
  }

  // header 可点击展开/收起 log —— 修复展开高度算上 padding
  const header = card.querySelector('.header');
  header.classList.add('cursor-pointer','hover:bg-gray-50');
  let expanded = false;
  header.onclick = ()=>{
    expanded = !expanded;
    if(expanded){
      // 先恢复 padding,scrollHeight 才会包含 padding 在内
      logs.style.paddingTop = PAD + 'px';
      logs.style.paddingBottom = PAD + 'px';
      logs.style.opacity = '1';
      // 再下一帧设 maxHeight,确保过渡顺滑
      requestAnimationFrame(()=>{
        logs.style.maxHeight = logs.scrollHeight + 'px';
      });
      // 过渡结束后取消 maxHeight 限制,避免内容溢出被截
      const onEnd = (e)=>{
        if(e.propertyName !== 'max-height') return;
        logs.removeEventListener('transitionend', onEnd);
        if(expanded) logs.style.maxHeight = 'none';
      };
      logs.addEventListener('transitionend', onEnd);
      caret.textContent = '▴';
    }else{
      // 折叠前先固定当前高度,再触发过渡到 0
      logs.style.maxHeight = logs.scrollHeight + 'px';
      requestAnimationFrame(()=>{
        logs.style.maxHeight = '0px';
        logs.style.paddingTop = '0px';
        logs.style.paddingBottom = '0px';
        logs.style.opacity = '0';
      });
      caret.textContent = '▾';
    }
  };

  scrollBottom();
  await sleep(450);
}

/* ============== 主流程 ============== */

  const preset = await renderHome();
  await enterChat();

  // 拿到该场景的剧本
  const s = scripts[preset.id];

  // 用户消息上屏
  step3_userMsg(preset.text);
  await sleep(600);

  // 意图澄清
  const cls = await step4_clarify(s.clarify);
  await sleep(300);
  step3_userMsg(cls);
  await sleep(500);

  // 任务规划 → 执行 → 回复 → 追问
  await step5_plan(s.plan);
  await step6_execute(s.tasks);
  await sleep(400);

  await step7_reply(s);
  await sleep(500);
  step8_followups(s.followups);
  scrollBottom();
}

main();
